<!-- file:// guard. Every asset below is an absolute URL (/css, /js), so an
     HTML file opened straight from disk resolves them at the filesystem root,
     loads zero styles and zero scripts, and renders the bare DOM skeleton that
     reads as "the new UI is unstyled". Say so explicitly instead. Kept first in
     <body> so it explains the state before the fallback markup shows. -->
<script>
(function () {
  if (location.protocol !== "file:") return;
  function explain() {
    var box = document.createElement("div");
    box.setAttribute("role", "alert");
    box.setAttribute("style", "margin:0;padding:14px 20px;background:#1d2430;color:#f2f6fb;" +
      "font:14px/1.7 system-ui,-apple-system,'Segoe UI',sans-serif;border-bottom:2px solid #4ea1ff;");
    box.innerHTML = "<strong>此页面必须由 ACP 服务打开，不能直接双击本地 HTML 文件。</strong><br>" +
      "直接打开本地文件时，绝对路径 <code>/css</code>、<code>/js</code> 会解析到磁盘根目录，" +
      "样式与脚本全部加载失败，于是只剩这份无样式骨架，且不会启动 Shell。<br>" +
      "请访问 <code>http://&lt;主机&gt;:8765/next/</code>（本机：<code>http://127.0.0.1:8765/next/</code>）。";
    document.body.insertBefore(box, document.body.firstChild);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", explain);
  } else {
    explain();
  }
})();
</script>
