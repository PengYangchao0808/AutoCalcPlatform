<!-- file:// guard. Every asset below is an absolute URL (/css, /js), so an
     HTML file opened straight from disk resolves them at the filesystem root,
     loads zero styles and zero scripts, and renders the bare DOM skeleton that
     reads as "the new UI is unstyled". Say so explicitly instead. Kept first in
     <body> so it explains the state before the fallback markup shows. -->
<script>
(function () {
  if (location.protocol !== "file:") return;
  function explain() {
    var box = document.createElement("div");
    box.setAttribute("role", "alert");
    box.setAttribute("style", "margin:0;padding:14px 20px;background:#1d2430;color:#f2f6fb;" +
      "font:14px/1.7 system-ui,-apple-system,'Segoe UI',sans-serif;border-bottom:2px solid #4ea1ff;");
    box.innerHTML = "<strong>此页面必须由 ACP 服务打开，不能直接双击本地 HTML 文件。</strong><br>" +
      "直接打开本地文件时，绝对路径 <code>/css</code>、<code>/js</code> 会解析到磁盘根目录，" +
      "样式与脚本全部加载失败，于是只剩这份无样式骨架，且不会启动 Shell。<br>" +
      "请访问 <code>http://&lt;主机&gt;:8765/next/</code>（本机：<code>http://127.0.0.1:8765/next/</code>）。";
    document.body.insertBefore(box, document.body.firstChild);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", explain);
  } else {
    explain();
  }
})();
</script>

     `id="acp-next-root"` + "ACP Next" on this entry. Keep both. -->

<div class="acp-shell" id="acp-shell" data-workspace="research" data-acp-ready="false">

      <div class="acp-shell-brand-mark" aria-hidden="true">A</div>
      <div class="acp-shell-brand-copy">
        <h1 data-i18n="shell.app.title">ACP 分子计算工作台 · Next</h1>
        <span class="acp-shell-badge-lab" data-i18n="shell.app.badge">实验入口</span>
      </div>
    </div>

    <nav class="acp-shell-switch" role="tablist" aria-label="工作区" data-i18n-aria="shell.workspace.switch_label">
      <button class="acp-shell-tab is-active" id="acp-tab-research" role="tab"
              aria-selected="true" aria-controls="acp-ws-research" data-workspace-id="research"
              tabindex="0" title="Alt+1/2/3 切换工作区" data-i18n-title="shell.workspace.shortcut_hint" type="button">
        <svg class="acp-shell-tab-icon" width="16" height="16" aria-hidden="true"><use href="#acp-i-research"/></svg>
        <span data-i18n="shell.workspace.research">研究</span>
      </button>
      <button class="acp-shell-tab" id="acp-tab-molecular" role="tab"
              aria-selected="false" aria-controls="acp-ws-molecular" data-workspace-id="molecular"
              tabindex="-1" title="Alt+1/2/3 切换工作区" data-i18n-title="shell.workspace.shortcut_hint" type="button">
        <svg class="acp-shell-tab-icon" width="16" height="16" aria-hidden="true"><use href="#acp-i-structure"/></svg>
        <span data-i18n="shell.workspace.molecular">分子</span>
      </button>
      <button class="acp-shell-tab" id="acp-tab-execution" role="tab"
              aria-selected="false" aria-controls="acp-ws-execution" data-workspace-id="execution"
              tabindex="-1" title="Alt+1/2/3 切换工作区" data-i18n-title="shell.workspace.shortcut_hint" type="button">
        <svg class="acp-shell-tab-icon" width="16" height="16" aria-hidden="true"><use href="#acp-i-task"/></svg>
        <span data-i18n="shell.workspace.execution">执行</span>

    </nav>

    <div class="acp-shell-focus" id="acp-focus-chip" role="status" aria-live="polite" data-empty="true">
      <span class="acp-shell-focus-empty" data-i18n="shell.focus.empty">未选择结构或任务</span>
    </div>

    <div class="acp-shell-actions">
      <button class="acp-shell-lang" id="acp-layout-edit" data-i18n="layout.title" type="button">配置布局</button>
      <a class="acp-shell-link-classic" href="/">
        <span data-i18n="shell.link.classic">经典工作台</span>
        <svg width="14" height="14" aria-hidden="true"><use href="#acp-i-external"/></svg>

      <button class="acp-shell-lang" id="acp-lang-toggle" data-i18n="shell.lang.toggle" type="button">中文 | EN</button>
      <div class="acp-shell-pill" id="acp-conn-pill" data-conn="unknown" data-i18n="shell.conn.unknown">连接状态未知</div>
    </div>
  </header>

  <main class="acp-shell-main" id="acp-shell-main">
    <section class="acp-workspace" id="acp-ws-research" role="tabpanel"

      <div class="acp-slot" data-slot="main"   id="acp-slot-research-main"></div>

      <div class="acp-slot" data-slot="bottom" id="acp-slot-research-bottom"></div>
    </section>
    <section class="acp-workspace" id="acp-ws-molecular" role="tabpanel"
             aria-labelledby="acp-tab-molecular" tabindex="0" hidden

      <div class="acp-slot" data-slot="main" id="acp-slot-molecular-main"></div>
      <div class="acp-slot" data-slot="side" id="acp-slot-molecular-side"></div>
    </section>
    <section class="acp-workspace" id="acp-ws-execution" role="tabpanel"
             aria-labelledby="acp-tab-execution" tabindex="0" hidden

      <div class="acp-slot" data-slot="bottom" id="acp-slot-execution-bottom"></div>
    </section>
  </main>
