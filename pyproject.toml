[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acp"
version = "0.3.0"
description = "Auto-Calc Platform: automated computational chemistry workflows (acp CLI) backed by the cccp (Computational Chemistry Connection Package) QC interface library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "QCcalc Team"}
]
keywords = ["computational-chemistry", "conformers", "molecular-modeling", "quantum-chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=2.1.0",
    "rdkit>=2022.09.1",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # XLSX report writer (acp.nmr.report.write_xlsx_report). Declared as a
    # CORE dep (not the `nmr` extra): `acp run nmr` is an active workflow
    # that always writes nmr_assignment.xlsx, and the writer's import guard
    # is pragma'd "openpyxl is in deps" — with openpyxl mandatory the
    # missing-openpyxl skip path is unreachable in supported installs, so
    # XLSX can never be silently skipped without a capability declaration.
    # Pure-python, no compiled wheels — safe on slim compute nodes too.
    "openpyxl>=3.1",
    "typing-extensions>=4.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "zipstream-ng>=1.9.0",
]
remote = [
    "paramiko>=3.0",
]
nmr = [
    "nmrglue>=0.10",
    "openbabel>=3.1",
    # FCHL-weighted DP5 (P4, DevDoc appendix D). NOTE: qml currently only
    # builds against numpy<2 (removed numpy.distutils; needs a Fortran
    # compiler). The DP5 path degrades gracefully to the unweighted KDE
    # fallback when qml is unavailable — see acp.nmr.error_model.
    "qml>=0.4",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    # test_acp2_science_plugin_production exercises `python -m build` offline.
    "build>=1.2",
    "httpx>=0.27",
    # tomllib is stdlib on 3.11+; 3.10 acceptance/tests need the backport.
    "tomli>=2.0; python_version < '3.11'",
]
browser = [
    "playwright==1.63.0",
]

[project.scripts]
acp = "acp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cccp*", "acp*", "acp_services*"]

# Ship non-.py package data. `acp/nmr/models/` is a DATA DIRECTORY (no
# __init__.py — see src/acp/nmr/AGENTS.md): DP5/FCHL binary artifacts
# (atomic_reps.gz, frag_reps.gz, *.p, tms_references.txt, LICENSE-DP5,
# NOTICE.md) loaded at runtime via acp.nmr.fchl / error_model. Without this
# entry setuptools only packs *.py and wheels silently lose ~64MB of model
# assets (wheel check: `atomic_reps.gz` must appear in the namelist —
# locked by tests/test_packaging_assets.py).
[tool.setuptools.package-data]
"acp.nmr" = ["models/*"]
# --- C08-s0 (T56/C39a) first-batch CCCP asset rule -------------------------
# T55 relocates the DP5/FCHL artifacts (atomic_reps.gz, frag_reps.gz, *.p,
# tms_references.txt, LICENSE-DP5, NOTICE.md) from `acp/nmr/models/` to the
# single CCCP asset location `src/cccp/analysis/nmr/model_assets/`
# (a data dir with no __init__.py). Keying package-data to the owning CCCP
# package makes an independently-built `cccp` wheel ship them. The glob
# matches nothing until the T55 move lands, so this hunk is safe to apply in
# the same integration batch as T55. T39 removes the stale `acp.nmr` line
# above once the old directory is gone.
"cccp.analysis.nmr" = ["model_assets/*"]
# A-27a science packaging request: the frozen contract corpus lands under
# `src/cccp/analysis/research/contracts/` (A-owned, byte-identical to the
# docs copy). The glob is inert until that directory lands, so applying it
# cannot break a wheel now; it keeps the root `acp` distribution and the
# independent `cccp` role in lockstep.
"cccp.analysis.research" = ["contracts/*.json", "contracts/*.md", "contracts/examples/*.json"]
"cccp" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `--strict-markers` is default-on so a mistyped/undeclared marker fails at
# collection instead of silently deselecting a gate. Adding a marker means
# registering it below (guarded by tests/test_ci_workflow_contract.py).
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require external binaries)",
    # Cross-stack contract suites (exported contracts, real MCP SDK handshake,
    # Bridge↔normalizer, HTTP↔frontend). They need RPH dist + Node, so the
    # py3.10/3.11/3.12 matrix excludes them and the dedicated CI
    # `mcp-conformance` lane owns the `-m contract` selection.
    "contract: cross-stack contract tests; excluded from the matrix, run by mcp-conformance",
    "nightly: reserved for the nightly lane; never selected by PR runs",
    "pre_release: reserved for release-candidate runs only",
    "requires_gaussian: marks tests that need Gaussian 16 installed",
    "requires_orca: marks tests that need ORCA installed",
    "requires_crest: marks tests that need CREST installed",
    "requires_xtb: marks tests that need xTB installed",
    "requires_isostat: marks tests that need ISOSTAT installed",
    "requires_shermo: marks tests that need Shermo installed",
    "requires_censo: marks tests that need CENSO installed",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
