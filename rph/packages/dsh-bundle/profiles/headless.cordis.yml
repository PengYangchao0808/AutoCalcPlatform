# RPH headless profile overlay — official DSH MCP client for the ACP MCP server.
#
# Apply with:
#   dsh --profile headless --patch rph/packages/dsh-bundle/profiles/headless.cordis.yml
#
# `insert` is the Cordis patch semantic for a NEW entry; `config` replaces the
# target row's whole config (no field-level deep merge).
#
# command/args/cwd/env below are byte-for-byte the B05 launch descriptor
# (sha256 ca807cc4b8014af265fac64c9b84ca3c4050df9bfbab3b5dc408ce068b548046).
#
# The headless profile has no agent-preset plane, so its global registry IS the
# model-visible set. The base bundle mounts bash/pwsh and the background-job
# controls; those rows are disabled here. `shell-env` stays mounted because the
# permission-presets row injects the `shell` service; it registers no tool.

- insert:
    - id: acp-mcp-acceptance
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: acp
        transport: stdio
        command: <acp2-dev>/venvs/b/bin/python
        args:
          - '-m'
          - acp
          - mcp
          - serve
          - '--transport'
          - stdio
          - '--controller'
          - http://127.0.0.1:18765
          - '--log-level'
          - INFO
        cwd: <repo>/src
        env:
          ACP_RUN_ROOT: <acp2-dev>/data/b/run-root
          ACP_CONTROLLER_URL: http://127.0.0.1:18765
          ACP2_MCP_LOG_LEVEL: INFO
          ACP2_TOOLS: <acp2-dev>/venvs
          ACP_CONFIG: <acp2-dev>/data/b/controller-config/cccp.yaml
          PATH: <acp2-dev>/venvs/b/bin:/usr/sbin:/usr/local/bin:/usr/bin:/bin
        toolCallTimeoutMs: 120000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

# No shell / exec / SSH / arbitrary-command surface in the model-visible set.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
