name: CI

# CI enabled 2026-08-21 — functional gates only (compile + test).
# Lint/format gates are DEFERRED: the repo carries pre-existing ruff debt
# (~678 `ruff check` errors, mostly legacy cccp/ reverse-sync code; 63 files
# not `ruff format`-clean). Re-enable once a dedicated hygiene wave lands:
#   - ruff check --fix src tests   (501 safe auto-fixes)
#   - ruff format src tests        (one-time formatting pass)
#   - then restore the lint/format steps below.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Git-history audits (tests/test_f4_scope_audit.py migration and
          # amendment checks) diff against a fixed BASELINE commit; a
          # shallow clone would silently degrade them to vacuous passes.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node for frontend syntax and behavior checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          # api extra required: API/scheduler tests import fastapi at module
          # level; remote extra required: scheduler/remote + test_remote_phase*
          # import paramiko at module level; [dev] alone fails collection.
          pip install -e '.[dev,api,remote]'
          # NMR spectra tests exercise the real nmrglue path; the full [nmr]
          # extra is NOT installable in CI (qml builds against numpy<2 with a
          # Fortran toolchain), so install nmrglue alone.
          # FCHL/DP5 combination matrix covered by the test suite (todo 38):
          #   - pure NumPy opt-in (ACP_FCHL_NUMPY=1): exercised every run on the
          #     checked-in assets (test_acp_nmr_fchl_availability.py,
          #     test_acp_nmr_fchl_golden.py).
          #   - compiled qml: only when qml is importable; otherwise the
          #     real-qml tests record NOT_VERIFIED (skip), never a pass.
          #   - off: typed tri-state; DP5 uses the unweighted KDE fallback.
          pip install nmrglue

      - name: Compile all Python source
        run: python -m compileall src tests

      - name: Run tests
        # Real-binary tests are collection-skipped; slow/integration suites
        # require --run-slow and external QC binaries (ORCA/CREST/xTB/...).
        run: pytest tests/ -m "not slow" -q

      - name: Install browser test dependencies
        if: matrix.python-version == '3.11'
        run: |
          pip install -e '.[browser]'
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/test_frontend_viewer_framing_browser.py tests/test_frontend_measure_edit_browser.py tests/test_frontend_multiframe_playback_browser.py tests/test_frontend_startup_browser.py tests/test_frontend_interaction.py --run-slow -q

      # --- deferred lint/format gates (see header note) ---
      # - name: Lint with ruff
      #   run: ruff check src tests
      # - name: Check formatting with ruff
      #   run: ruff format --check src tests

  # C B-req-06: the private `rph/` pnpm workspace is built only when the
  # committed lockfile exists; the repository root deliberately carries no
  # package.json/pnpm-workspace.yaml/lockfile. The static-asset mount itself
  # is B25b scope, not this build job.
  rph-detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f rph/pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  rph:
    needs: rph-detect
    if: needs.rph-detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - name: Configure out-of-tree pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Check boundaries and typecheck
        run: pnpm check
      - name: Package release tarballs
        run: pnpm package
      - name: Retain release packages
        uses: actions/upload-artifact@v4
        with:
          name: rph-dist-packages
          path: rph/dist-packages/*.tgz
          if-no-files-found: error
