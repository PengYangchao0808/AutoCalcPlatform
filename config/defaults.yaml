# ConformerSearch Default Configuration
# ======================================
#
# This file matches the Python built-in defaults from
# src/cccp/config.py:_get_default_config().
# It is the SINGLE source of truth for default values when loaded
# via load_config(); the Python built-in serves as fallback only.
#
# Copy this file and modify as needed for your environment.

# ==================== Executable Paths ====================
executables:
  orca:
    path: "orca"  # ORCA executable (resolved via PATH by cccp.software.resolve_executable)
    nproc: 10               # ORCA-specific core count (overrides resources.nproc if set)
    maxcore:            # ORCA-specific maxcore in MB (auto-calculated if not set)

  xtb:
    path: "xtb"  # xTB executable
    fallback_paths:  # legacy locations consulted by cccp.software.resolve_executable
      - "/opt/xtb/bin/xtb"
      - "/usr/local/bin/xtb"

  crest:
    path: "crest"  # CREST executable
    gfn_level: 2

  censo:
    path: "censo"  # CENSO executable

  isostat:
    path: "isostat"  # ISOSTAT executable

  shermo:
    path: "Shermo"  # Shermo executable

  molclus:
    path: "molclus"  # Molclus executable

# ==================== Computational Resources ====================
resources:
  nproc: 16       # Number of CPU cores (built-in default)
  mem: "30GB"     # Memory limit
  orca_maxcore_safety: 0.8  # ORCA maxcore safety factor

# ==================== Theory Level Configuration ====================
theory:
  # DFT Optimization (for final geometry optimization)
  optimization:
    method: r2SCAN-3c
    basis: ""
    solvent: null
    solvent_model: none
    engine: orca

  frequency:
    engine: orca

  single_point:
    method: wB97M-V
    basis: def2-TZVPP
    solvent: null
    solvent_model: none

  preoptimization:
    gfn_level: 2
    solvent: null
    solvent_model: none

  nmr:
    engine: orca
    method: mPW1PW91   # P1b (2026-08-07): Goodman DP4/DP5 reference level
    basis: 6-311G(d)
    solvent: null
    solvent_model: cpcm

# ==================== Thermodynamic Parameters ====================
thermo:
  temperature_k: 298.15  # built-in default
  pressure_atm: 1.0
  scl_zpe: 0.9905
  shermo_ilowfreq: 2
  shermo_imagreal: 0
  shermo_conc: 1.0  # Optional, comment out or set to null to disable concentration correction

# ==================== NMR Parameters ====================
nmr:
  temperature_k: 298.15
  energy_window_kcal: 3.0
  max_conformers: 10
  references:
    "1H": null
    "13C": null
    "15N": null
    "19F": null
    "31P": null

# ==================== CENSO (ensemble / energy workflows) ====================
# Mirror of Python built-in defaults (config.py::_get_default_config).
# This file is NOT synced to compute nodes — nodes use Python built-ins plus
# their own ~/.cccp.yaml.
censo:
  preset: censo-light
  solvent: null
  solvent_model: none
  temperature: 298.15
  scale: 1.0
  keep_all: false
  ewin: 6.0
  refinement_threshold: 0.99
  refinement_func: wb97m-v
  refinement_basis: def2-tzvpp
  optimization:
    enabled: true
    functional: r2SCAN-3c
    threshold: 3.0
    optlevel: normal
    maxcyc: 200
    optcycles: 8
    macrocycles: true
    xtb_opt: true
  presets: {}
  levels: {}

# ==================== Conformer Search Protocols ====================
# Per-stage control: set any stage to false to skip it.
# Stages: crest, clustering, optimization, frequency, single_point, shermo
protocols:
  default: censo-lite

  # EXT Protocol: Two-stage CREST (GFN0→GFN2) + full DFT handoff
  # Recommended for most organic molecules
  ext:
    stages:
      crest: true
      clustering: true
      optimization: true
      frequency: true
      single_point: true
      shermo: true
    two_stage_enabled: true
    ngeom_default: 3
    ngeom_max: 6
    funnel:
      search_mode: crest_two_stage_gfn0_to_gfn2
      clustering_mode: isostat
      prescreen_mode: none
      rerank_mode: none
    handoff:
      mode: optimize_all_candidates
      ranking_after_handoff: final_sp_minimum
    opt_engine: null      # Per-protocol override; null = use theory.optimization.engine
    freq_engine: null     # Per-protocol override; null = use theory.frequency.engine
    final_opt_sp:
      final_sp_method: wB97M-V   # built-in default
      final_sp_basis: def2-TZVPP  # built-in default

  # CENSO-ZERO Protocol: Economical rank-1 refinement with single-point only
  censo-zero:
    stages:
      crest: true
      clustering: true
      optimization: false
      frequency: false
      single_point: true
      shermo: false
    two_stage_enabled: false
    ngeom_default: 1
    ngeom_max: 3
    funnel:
      search_mode: crest_gfn2
      clustering_mode: isostat
      prescreen_mode: none
      rerank_mode: none
      survivor_window_kcal: 1.0
    handoff:
      mode: optimize_rank1
      ranking_after_handoff: xtb_energy
    opt_engine: null
    freq_engine: null
    final_opt_sp:
      final_sp_method: wB97M-V
      final_sp_basis: def2-TZVPP

  # CENSO-LITE Protocol: Low-cost DFT SP rerank economical recipe
  censo-lite:
    stages:
      crest: true
      clustering: true
      optimization: false
      frequency: false
      single_point: true
      shermo: false
    two_stage_enabled: false
    ngeom_default: 4
    ngeom_max: 6
    funnel:
      search_mode: crest_gfn2
      clustering_mode: isostat
      prescreen_mode: none
      rerank_mode: r2scan3c_sp
      use_mrrho_like_correction: true
      optimize_limit: 1
      top2_fallback_enabled: true
      boltzmann_cutoff: 0.90
    handoff:
      mode: optimize_rank1
      fallback_mode: optimize_top2_if_gap_small
      small_gap_kcal: 1.0
      ranking_after_handoff: final_sp_minimum
    opt_engine: null
    freq_engine: null
    final_opt_sp:
      final_sp_method: wB97M-V
      final_sp_basis: def2-TZVPP

  # CENSO-FULL Protocol: Grimme-style Part0-Part3 full refinement recipe
  censo-full:
    stages:
      crest: true
      clustering: true
      optimization: true
      frequency: true
      single_point: true
      shermo: true
    two_stage_enabled: false
    ngeom_default: 12
    ngeom_max: 24
    funnel:
      search_mode: crest_gfn2
      clustering_mode: isostat
      prescreen_mode: low_cost_dft_sp
      rerank_mode: r2scan3c_sp_plus_mrrho
      prescreen_window_kcal: 4.0
      screening_window_kcal: 3.5
      survivor_window_kcal: 3.0
    handoff:
      mode: optimize_all_survivors_within_window
      ranking_after_handoff: final_sp_plus_boltzmann
    opt_engine: null
    freq_engine: null
    final_opt_sp:
      final_sp_method: wB97M-V
      final_sp_basis: def2-TZVPP

  # CENSO-FULL-SAFE Protocol: Relaxed windows for reactive or ionic systems
  censo-full-safe:
    stages:
      crest: true
      clustering: true
      optimization: true
      frequency: true
      single_point: true
      shermo: true
    two_stage_enabled: false
    ngeom_default: 12
    ngeom_max: 24
    funnel:
      search_mode: crest_gfn2
      clustering_mode: isostat
      prescreen_mode: low_cost_dft_sp
      rerank_mode: r2scan3c_sp_plus_mrrho
      prescreen_window_kcal: 8.0
      screening_window_kcal: 6.0
      survivor_window_kcal: 4.0
      boltzmann_cutoff: 0.99
    handoff:
      mode: optimize_all_survivors_within_window
      ranking_after_handoff: final_sp_plus_boltzmann
    opt_engine: null
    freq_engine: null
    final_opt_sp:
      final_sp_method: wB97M-V
      final_sp_basis: def2-TZVPP

  # ALLOPT Protocol: Exhaustive DFT validation of all clustered candidates
  allopt:
    stages:
      crest: true
      clustering: true
      optimization: true
      frequency: true
      single_point: true
      shermo: true
    two_stage_enabled: true
    ngeom_default: 48
    ngeom_max: 48
    funnel:
      search_mode: crest_two_stage_gfn0_to_gfn2
      clustering_mode: isostat
      prescreen_mode: none
      rerank_mode: none
    handoff:
      mode: optimize_all_candidates
      ranking_after_handoff: final_sp_plus_boltzmann
    opt_engine: null
    freq_engine: null
    final_opt_sp:
      final_sp_method: wB97M-V
      final_sp_basis: def2-TZVPP

  # REFERENCE-SP Protocol: High-level SP refinement on an existing ensemble
  reference-sp:
    stages:
      crest: false
      clustering: false
      optimization: false
      frequency: false
      single_point: true
      shermo: false
    two_stage_enabled: false
    ngeom_default: 48
    ngeom_max: 48
    funnel:
      search_mode: external_xyz
      clustering_mode: none
      prescreen_mode: none
      rerank_mode: none
    handoff:
      mode: optimize_all_candidates
      ranking_after_handoff: final_sp_minimum
    opt_engine: null
    freq_engine: null
    final_opt_sp:
      final_sp_method: DLPNO-CCSD(T)
      final_sp_basis: def2-TZVPP

# ==================== Cluster Configuration ====================
# Set 'enabled: true' and specify type for cluster execution.
# For remote compute-node dispatch (SSH/SFTP to OpenLAVA nodes), set
# 'execution_mode: remote' and list nodes under 'nodes'.
# Passwords are provided via env vars (ACP_REMOTE_PASSWORD_<NAME>), never YAML.
cluster:
  enabled: false       # Set to true for cluster execution
  execution_mode: local  # 'local' (subprocess) or 'remote' (SSH/SFTP to OpenLAVA nodes)
  poll_interval: 30    # Remote job status poll interval (seconds)
  retention_days: 180  # Remote job directory retention before cleanup
  auto_sync: true      # Auto-sync ACP source to remote nodes before submitting
  require_all_binaries: true  # Fail pre-submit when a workflow-required binary
                              # is not resolvable on the node (false = warn only)
  # pre_cmds:          # Shell lines injected into every LSF script before the
  #   - "module load python/3.12"   # CLI runs (module-based HPC clusters)
  #   - "source /opt/spack/share/spack/setup-env.sh"
  type: local          # 'local', 'lsf', 'slurm', 'pbs'
  queue: normal        # Cluster queue name
  walltime: ""         # Job walltime (HH:MM); empty = no #BSUB -W run-time limit
  extra_flags: ""      # Additional LSF/PBS flags
  nodes: []            # Remote compute nodes (see plan §13 for example)
  # Per-node QC binary declaration (bootstrap_node creates these as ~/bin
  # symlinks so binaries resolve regardless of the cluster's login PATH):
  # nodes:
  #   - name: compute-01
  #     host: 10.0.0.1
  #     username: acp
  #     remote_work_dir: /scratch/acp/acp_jobs
  #     remote_code_dir: /home/acp/acp_code
  #     python_executable: /opt/anaconda3/bin/python
  #     bin_symlinks:
  #       orca: /opt/orca611/orca
  #       xtb: /opt/xtb-dist/bin/xtb
  #       crest: /opt/crest/crest
  #       censo: /opt/anaconda3/bin/censo
  #       Shermo: /opt/Shermo_2.6.1/Shermo

  # Local execution target (first-class). max_jobs caps concurrent local
  # jobs; submissions beyond the ceiling stay STARTING until a slot frees.
  # User-controlled only — never auto-derived from os.cpu_count().
  # Keep in sync with cccp.config._get_default_config() cluster.local.
  local:
    max_jobs: 4

  # Local run_root lifecycle management (Phase 5B — local disk protection).
  # Protects the ACP Server's own run_root from unbounded growth.
  local_retention:
    enabled: true             # Master switch; false disables all local cleanup
    completed_days: 30        # work_dir retention for completed/cancelled/orphan jobs
    failed_days: 90           # work_dir retention for failed jobs (kept longer for triage)
    cancelled_days: 30        # work_dir retention for cancelled jobs
    db_record_days: 365       # SQLite row retention (independent of work_dir)
    cleanup_interval_hours: 6 # Background sweeper interval
    disk_cleanup_threshold: 90  # >this% triggers a retention sweep before submit
    disk_skip_threshold: 95     # >this% rejects submission (even after sweep)
    max_dirs_per_sweep: 200   # Cap on dirs removed per sweep
    vacuum_after_db_cleanup: false  # VACUUM after DB pruning (locks DB; off by default)

# ==================== Mechanism Study ====================
# Manual-only bond editing for the Workbench reaction builder: automatic
# atom mapping and bond-change determination are DISABLED; bond changes
# must come from user-provided manual_bond_changes (explicit
# manual_bond_editing: false in the API request restores the legacy auto
# path for tests/CLI parity).
# Keep in sync with MECHANISM_MANUAL_BOND_EDITING_DEFAULT in
# src/acp/core/config.py (authoritative built-in).
mechanism:
  manual_bond_editing: true

# ==================== Optimization Control ====================
# recalc_hess: 'auto' infers the ORCA Recalc_Hess interval from elements:
#   light (CHON+halogens) → initial Hessian only (no recalc);
#   P/S/Si/B-only → 10 (legacy default); metals/other → 7 (conservative).
# Set to an integer (e.g. 10) to pin the legacy behaviour site-wide.
optimization_control:
  recalc_hess: "auto"
  timeout:
    default_seconds: 86400  # Default QC job timeout in seconds
